<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تَيْسِيرُ الانْتِفَاعِ بِشَرْحِ مُخْتَصَرِ أَبِي شُجَاعٍ — لِفَضِيلَةِ الشَّيْخِ أَحْمَدَ الْجَوْهَرِيِّ</title>
<style>
@font-face {
  font-family: 'AmiriBook';
  src: url('file:///home/antigravity/.local/share/fonts/amiri/Amiri-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal;
}
@font-face {
  font-family: 'AmiriBook';
  src: url('file:///home/antigravity/.local/share/fonts/amiri/Amiri-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal;
}
@font-face {
  font-family: 'AmiriBook';
  src: url('file:///home/antigravity/.local/share/fonts/amiri/Amiri-Italic.ttf') format('truetype');
  font-weight: 400; font-style: italic;
}
@font-face {
  font-family: 'AmiriQuranFont';
  src: url('file:///home/antigravity/.local/share/fonts/amiri/AmiriQuran.ttf') format('truetype');
  font-weight: 400; font-style: normal;
}

:root {
  --ink: #111111;
  --accent: #111111;
  --matn-ink: #111111;
  --strong-ink: #111111;
  --ayah-ink: #111111;
  --rule-ink: #111111;
  --fn-num-ink: #111111;
  --subtle-ink: #333333;
}

body.edition-two-color {
  --ink: #111111;
  --accent: #9B111E;
  --matn-ink: #9B111E;
  --strong-ink: #9B111E;
  --ayah-ink: #111111;
  --rule-ink: #9B111E;
  --fn-num-ink: #9B111E;
  --subtle-ink: #444444;
}

@page {
  size: 162mm 234mm;
  margin: 0;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: 'AmiriBook', serif;
  color: var(--ink);
  background: #fff;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  font-feature-settings: "kern" 1, "liga" 1, "mark" 1, "mkmk" 1;
}

.page {
  width: 162mm;
  height: 234mm;
  padding: 10.5mm 19mm 12.5mm 19mm;
  position: relative;
  overflow: hidden;
  page-break-after: always;
  break-after: page;
  display: flex;
  flex-direction: column;
  background: #fff;
}
.page:last-child {
  page-break-after: auto;
  break-after: auto;
}

.page.cover-page {
  padding: 0;
}
.cover-img {
  width: 162mm;
  height: 234mm;
  display: block;
  object-fit: cover;
}

.page.framed-page {
  padding: 12.5mm 14mm;
}

/* Title & Edition double frames */
.frame-outer {
  width: 100%;
  height: 100%;
  border: 2.2pt solid var(--accent);
  padding: 2.5pt;
}
.frame-inner {
  width: 100%;
  height: 100%;
  border: 0.75pt solid var(--accent);
  padding: 12mm 10mm 10mm 10mm;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.title-plate-main {
  font-size: 24pt;
  font-weight: 700;
  line-height: 1.9;
  margin-top: 3mm;
  color: var(--accent);
}
.title-plate-sub {
  font-size: 14pt;
  margin: 10pt 0 4pt 0;
  color: var(--ink);
}
.title-plate-desc {
  font-size: 17pt;
  font-weight: 700;
  line-height: 1.9;
  margin-top: 8pt;
  color: var(--ink);
}
.title-plate-author {
  font-size: 13.5pt;
  color: var(--ink);
}
.title-plate-author strong {
  color: var(--accent);
}
.title-plate-divider {
  font-size: 11.2pt;
  margin-top: 10pt;
  border-top: 0.5pt solid var(--rule-ink);
  padding-top: 8pt;
}
.title-plate-bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 10.8pt;
  font-weight: 700;
  padding: 0 4mm;
  color: var(--accent);
}

.disclaimer-box {
  border: 1pt solid var(--accent);
  padding: 5mm 9mm;
  margin: 2mm auto;
  width: 90%;
  font-size: 12pt;
  font-weight: 700;
  line-height: 1.85;
  color: var(--ink);
}
.colophon-source-box {
  border-top: 0.6pt solid var(--rule-ink);
  padding-top: 5pt;
  width: 90%;
  font-size: 10.2pt;
  line-height: 1.8;
}
.colophon-source-title {
  font-weight: 700;
  color: var(--accent);
  font-size: 10.8pt;
  margin: 1pt 0;
}
.colophon-accent {
  color: var(--accent);
  font-weight: 700;
}
.colophon-foot {
  border-top: 0.7pt solid var(--rule-ink);
  padding-top: 4pt;
  width: 85%;
  font-size: 10.5pt;
  color: var(--accent);
  font-weight: 700;
}

/* Running header — unclipped upper diacritics & clean baseline alignment */
.running-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 0.8pt solid var(--rule-ink);
  padding: 2pt 0 3pt 0;
  margin-bottom: 4pt;
  font-size: 9.8pt;
  line-height: 2.05;
  flex-shrink: 0;
  overflow: visible;
}
.rh-title {
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
  overflow: visible;
  line-height: 2.05;
  padding-top: 1.5pt;
}
.rh-badge-wrap {
  display: inline-flex;
  align-items: center;
  gap: 2.5pt;
  color: var(--accent);
  direction: ltr;
  flex-shrink: 0;
  padding-top: 1.5pt;
}
.rh-wing-svg {
  width: 18pt;
  height: 9pt;
  display: block;
  color: var(--accent);
}
.rh-pill {
  border: 0.85pt solid var(--accent);
  border-radius: 999px;
  padding: 0.5pt 7.5pt 1pt 7.5pt;
  min-width: 10.5mm;
  text-align: center;
  font-weight: 700;
  font-size: 9.5pt;
  line-height: 1.3;
  color: var(--accent);
}

/* Core body frame containing Upper Matn + Rule + Lower Sharh + Footnotes */
.body-frame {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: visible;
  min-height: 0;
  padding-top: 4pt;
  padding-bottom: 0;
}

/* Ornate Arabesque Header Frame */
.chapter-banner {
  width: 100%;
  margin: 0;
  text-align: center;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.chapter-banner-img {
  width: 124mm;
  height: 22.32mm;
  display: block;
  margin: 0 auto;
}
.chapter-banner + .preface-h,
.chapter-banner + .matn-book-title,
.chapter-banner + .toc-page-title {
  margin-top: -5mm;
  position: relative;
  z-index: 2;
}

/* Upper Zone: Matn al-Wasitiyyah */
.matn-zone {
  font-size: 13.2pt;
  line-height: 1.88;
  flex-shrink: 0;
  color: var(--matn-ink);
}
.matn-book-title {
  text-align: center;
  font-size: 17pt;
  font-weight: 700;
  line-height: 2.05;
  padding-top: 3pt;
  margin: 0 0 4pt 0;
  color: var(--accent);
}
.matn-bracket-title {
  text-align: center;
  font-size: 14pt;
  font-weight: 700;
  line-height: 2.0;
  padding-top: 3pt;
  margin: 0 0 4pt 0;
  color: var(--accent);
}
.matn-sub-label {
  text-align: center;
  font-size: 12pt;
  font-weight: 700;
  line-height: 1.7;
  margin: 0 0 2.5pt 0;
  color: var(--subtle-ink);
}
.matn-p {
  margin: 0 0 1.5pt 0;
  text-align: justify;
  text-align-last: right;
  text-indent: 1.4em;
}
.matn-basmalah {
  text-align: center;
  font-family: 'AmiriQuranFont', 'AmiriBook', serif;
  font-size: 15.5pt;
  line-height: 1.95;
  margin: 1pt 0 3pt 0;
  color: var(--matn-ink);
}
.matn-cont-dots {
  text-align: center;
  font-size: 13.5pt;
  line-height: 1.35;
  letter-spacing: 0.5pt;
  color: var(--accent);
  margin: 1pt 0 3pt 0;
}
.preface-h {
  text-align: center;
  font-size: 16.5pt;
  font-weight: 700;
  line-height: 2.05;
  padding-top: 3pt;
  margin: 2pt 0 6pt 0;
  color: var(--accent);
}

/* Inline superscript footnote marker inside Matn */
.fn-ref {
  font-size: 0.62em;
  vertical-align: super;
  line-height: 0;
  font-weight: 700;
  margin-right: 1pt;
  color: var(--fn-num-ink);
}

/* Three Side-by-Side Ornamental 8-Petal Floral Stars */
.stars-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24pt;
  margin: 4.5pt 0 3.5pt 0;
  flex-shrink: 0;
  color: var(--accent);
}
.star-svg {
  width: 11pt;
  height: 11pt;
  display: block;
  color: var(--accent);
}

/* Middle full-width rule separating Matn above from Sharh below */
.split-rule {
  border: none;
  border-top: 0.75pt solid var(--rule-ink);
  margin: 4pt 0 5.5pt 0;
  flex-shrink: 0;
}

/* Lower Zone: Commentary */
.sharh-zone {
  font-size: 11.4pt;
  line-height: 1.78;
  flex: 1;
  overflow: visible;
  min-height: 0;
  color: var(--ink);
}
.sharh-zone.tight-fit {
  font-size: 10.95pt;
  line-height: 1.67;
}
.sharh-zone.tight-fit .sharh-p {
  margin-bottom: 0.5pt;
}
.sharh-p {
  margin: 0 0 1.5pt 0;
  text-align: justify;
  text-align-last: right;
  text-indent: 1.4em;
}
.sharh-p.cont {
  text-indent: 0;
}
.sharh-p strong, .sharh-zone strong {
  font-weight: 700;
  color: var(--strong-ink);
}
.ayah {
  font-family: 'AmiriQuranFont', 'AmiriBook', serif;
  font-size: 11.4pt;
  line-height: 1.78;
  color: var(--ayah-ink);
}
.matn-zone .ayah {
  font-size: 13.2pt;
  color: var(--matn-ink);
}
.ayah-ref {
  font-family: 'AmiriBook', serif;
  font-size: 8.5pt;
  font-weight: 400;
  color: var(--subtle-ink);
  letter-spacing: 0;
  white-space: nowrap;
}

/* Per-page footnotes */
.footnote-area {
  margin-top: auto;
  padding-top: 5pt;
  flex-shrink: 0;
}
.footnote-rule {
  width: 34mm;
  border-top: 0.55pt solid var(--rule-ink);
  margin-bottom: 2.5pt;
}
.footnote-text {
  font-size: 8.8pt;
  line-height: 1.55;
  color: var(--ink);
}
.fn-lesson-note {
  color: var(--subtle-ink);
  font-size: 8.4pt;
  margin-bottom: 1pt;
}
.fn-gloss-row {
  margin-top: 0.5pt;
}
.fn-gloss-num {
  font-weight: 700;
  color: var(--fn-num-ink);
}
.fn-gloss-term {
  font-weight: 700;
  color: var(--ink);
}

/* Basmalah Calligraphic PNG Plate (pg-4) */
.basmalah-plate-img {
  width: 72mm;
  height: 67.36mm;
  display: block;
  margin: 0 auto;
}

/* Two-Column General Index & Ayah Index */
.toc-page-title {
  text-align: center;
  font-size: 16.5pt;
  font-weight: 700;
  line-height: 2.0;
  padding-top: 3pt;
  margin: 2pt 0 7pt 0;
  color: var(--accent);
}
.toc-two-col {
  display: flex;
  flex-direction: row;
  gap: 0;
  flex: 1;
  align-items: stretch;
  min-height: 0;
}
.toc-col {
  width: 50%;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.toc-col-right {
  padding-left: 5.5mm;
  border-left: 0.6pt solid var(--rule-ink);
}
.toc-col-left {
  padding-right: 5.5mm;
}
.toc-book-row {
  font-size: 9.8pt;
  font-weight: 700;
  margin: 4pt 0 1.5pt 0;
  line-height: 1.5;
  display: flex;
  align-items: baseline;
  color: var(--accent);
}
.toc-book-row a {
  color: var(--accent);
  text-decoration: none;
}
.toc-book-label {
  padding-right: 10pt;
  white-space: nowrap;
}
.toc-row {
  display: flex;
  align-items: baseline;
  font-size: 8.8pt;
  line-height: 1.55;
  margin: 0.5pt 0;
}
.toc-row a, .ayah-idx-pages a {
  color: var(--ink);
  text-decoration: none;
}
.toc-row-title {
  white-space: normal;
  max-width: 85%;
}
.toc-dots {
  flex: 1;
  border-bottom: 1pt dotted #555;
  margin: 0 3pt 3pt 3pt;
  min-width: 8pt;
}
.toc-pg {
  font-size: 9pt;
  white-space: nowrap;
  color: var(--accent);
  font-weight: 700;
}
.toc-section-center {
  text-align: center;
  font-size: 11pt;
  font-weight: 700;
  margin: 5pt 0 2pt 0;
  color: var(--accent);
}
.index-col-head {
  display: flex;
  justify-content: space-between;
  font-size: 10.2pt;
  font-weight: 700;
  border-bottom: 0.6pt solid var(--rule-ink);
  padding-bottom: 2pt;
  margin-bottom: 4pt;
  color: var(--accent);
}
.ayah-idx-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 0.3pt solid #ccc;
  padding: 2.5pt 0;
  font-size: 10pt;
  line-height: 1.6;
}
.ayah-idx-text {
  font-family: 'AmiriQuranFont', 'AmiriBook', serif;
  flex: 1;
  padding-left: 6pt;
  color: var(--ink);
}
.ayah-idx-pages {
  white-space: nowrap;
  font-size: 9.8pt;
  min-width: 14mm;
  text-align: left;
  color: var(--accent);
  font-weight: 700;
}
</style>
</head>
